[package]
name = "vork-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vork-inputs = { path = "../vork-inputs" }
anyhow = "1"
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Pipes"] }
