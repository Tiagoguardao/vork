# Ported from Moda (desktop-moda native/crates/moda-assets); the changes are listed in PROVENANCE.md.
[package]
name = "moda-assets"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Moda's asset layer: local source resolution, decode, ICC, SVG raster, placeholders, pattern packing."

[lib]
doctest = false

[dependencies]
wgpu = { version = "29", default-features = false }
# vork reads PNG and JPEG into a canvas; the image crate's other default formats (AVIF and its encoder among them) are
# left out.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
moxcms = "0.8"
fast_image_resize = "6"
resvg = "0.47"
bytemuck = { version = "1", features = ["derive"] }
base64 = "0.22"
anyhow = "1"

moda-scene = { path = "../moda-scene" }
moda-shaders = { path = "../moda-shaders" }
# The prefetch's decoded-raster cache key (fetch.rs `decoded_raster`).
blake3 = { version = "1", optional = true }

[features]
default = ["native-io"]
# Native local-source prefetch (files / data: URIs, decoded on a thread pool).
native-io = ["dep:blake3"]

[dev-dependencies]
png = "0.18"
